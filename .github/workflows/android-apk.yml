name: Build Mizan Android APK

on:
  push:
    branches: [ main, mizan-android-build ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mizan_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.29.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Regenerate clean Android Gradle project (minSdk 24)
        run: |
          rm -rf android
          flutter create --platforms=android --org com.mizan --project-name mizan_app .
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          fi

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Mizan v3.3 Unit Tests
        run: flutter test

      - name: Build Split Release APKs (arm64-v8a & armeabi-v7a)
        run: flutter build apk --release --split-per-abi

      - name: Upload Compact Release APKs (22-30 MB)
        uses: actions/upload-artifact@v4
        with:
          name: mizan-android-release-v3.3
          path: |
            frontend/mizan_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            frontend/mizan_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
