openapi: 3.1.0
info:
  title: Mizan (ميزان) — Production Ready Global Accounting, Touch POS, Voice & Trust Network API
  version: 2.2.0
paths:
  /health: { get: { summary: Container readiness & liveness probe } }
  /api/v1/auth/register: { post: { summary: Register user with PBKDF2-SHA512 hash } }
  /api/v1/auth/login: { post: { summary: Authenticate and issue JWT Access + SHA-256 Refresh Token } }
  /api/v1/auth/refresh: { post: { summary: Atomic refresh token rotation with reuse detection } }
  /api/v1/auth/logout: { post: { summary: Revoke active refresh token } }
  /api/v1/organizations: { post: { summary: Create organization & auto-seed 10 standard CoA accounts } }
  /api/v1/ledger/trial-balance/variance: { get: { summary: Verify org Trial Balance Variance == 0.0000 } }
  /api/v1/ledger/purchases: { post: { summary: Record IAS 2 Inventory Purchase & persist FIFO Layer } }
  /api/v1/ledger/advances: { post: { summary: Record IFRS 15 Customer Advance Liability } }
  /api/v1/ledger/deliveries: { post: { summary: Record Delivery & Recognize IFRS 15 Revenue + IAS 2 COGS } }
  /api/v1/ledger/entries/{entryId}/reverse: { post: { summary: Post Immutable Mirror Reversal Entry } }
  /api/v1/gates/{gateId}/documents: { post: { summary: Dispatch UBL 2.1 document over approved Trade Gate } }
  /api/v1/gates/{gateId}/documents/{documentId}/approve: { post: { summary: Receiver approves Trade Gate document } }
  /api/v1/gates/ubl-preview: { post: { summary: Generate ISO/IEC 19845 (UBL 2.1) invoice document } }
  /api/v1/p2p/orders: { post: { summary: Create and authorize P2P Order (Pre-Auth/Cash/Credit) } }
  /api/v1/p2p/orders/{orderId}/release: { post: { summary: Buyer confirms inspection & releases payment } }
  /api/v1/p2p/orders/check-dispute-eligibility: { post: { summary: Verify live-camera-only & perishable 30-min dispute window } }
  /api/v1/pilot/meters: { post: { summary: Record daily water/utility meter reading & auto-reconcile sales delta } }
  /api/v1/pilot/custody: { post: { summary: Record returnable tank/equipment custody movement } }
  /api/v1/preferences/features: { get: { summary: Retrieve all 25 effective operational feature flags } }
  /api/v1/preferences/features/{featureKey}: { put: { summary: Toggle org-configurable operational module (Owner only) } }
  /api/v1/fx/exchange-vouchers: { post: { summary: Execute & persist Direct Currency Exchange Voucher (IAS 21) } }
  /api/v1/translation/field: { post: { summary: Cross-border text translation (gated OFF in Phase 1) } }
  /api/v1/pos/shifts/open: { post: { summary: Open persistent cashier shift on POS terminal } }
  /api/v1/pos/variants/lookup/{barcode}: { get: { summary: Real DB lookup of Size/Color variant by barcode } }
  /api/v1/voice/commands: { post: { summary: Parse bilingual voice command into read-only or DRAFT_AWAITING_CONFIRM } }
  /api/v1/voice/commands/{commandId}/confirm: { post: { summary: Confirm voice draft (PIN/Biometric for high value) } }
  /api/v1/workspace/resolve-profile: { post: { summary: Resolve Workspace Experience Mode intersected with RBAC } }
  /api/v1/reports/daily-a4/html: { post: { summary: Render clean A4 printable report stripping empty rows } }
