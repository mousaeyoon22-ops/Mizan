# Mizan (ميزان) — Peak-Hour Tuned Nginx Configuration (TLS 1.3 + SignalR + Keepalive Pool)
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;   # Upgraded from 1024 to support 4,000+ simultaneous SignalR + HTTP clients
    multi_accept on;
    use epoll;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Tiered Rate-Limiting Zones (protects auth without starving legitimate multi-cashier NAT shops)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn_limit:20m;

    upstream mizan_api_pool {
        server mizan-api:8080 max_fails=3 fail_timeout=15s;
        keepalive 64; # Reuses TCP connections to .NET 8 Kestrel under peak storm
    }

    server {
        listen 443 ssl http2;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 10m;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # SignalR Realtime Hub (QR Live Cart & Contextual Chat)
        location /hubs/ {
            limit_conn ws_conn_limit 200;
            proxy_pass http://mizan_api_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Standard REST API
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://mizan_api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Required for upstream keepalive pool
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
