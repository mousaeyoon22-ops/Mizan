publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  signalr_netcore: ^1.3.7
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sql/
